<!DOCTYPE html>
<html lang="es">
    <link rel="stylesheet" href="tres.css">

<head>
    <link href="Imagenes/pngwing.com(1).ico " rel=" icon ">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaberTech - Contacto</title>
      
</head>
<body>
    <header class="container">
        <div class="container-co">
            <div class="logo"> <img src="Imagenes/pngwing.com(1).png" width="90"></div>
            <nav>
                <ul class="menu">
                    <li><a href="index.html" class="enlace"> Inicio</a></li>
                    <li><a href="index2.html" class="enlace">Productos</a></li>
                    <li><a href="index3.html" class="enlace">Contacto</a></li>
                    <li><a href="index4.html" class="enlace">Sobre Nosotros</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container3">
        <div class="contenido">
            <h1 class="titulo">Contáctanos</h1>
            <p class="subtitulo">¿Tienes preguntas sobre nuestros productos? Escríbenos.</p>
            </div>
        </div>
    <div class="contact-container">
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Asunto</label>
                <input type="text" id="subject" required>
            </div>
            
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="btn">Enviar Mensaje</button>
        </form>
        
        <div class="contact-info">
            <h3>Información de Contacto</h3>
            <p>Email: contacto@sabertech.com</p>
            <p>Teléfono: +1 234 567 890</p>
            <p>Horario: Lunes a Viernes, 9am - 6pm</p>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2023 SaberTech. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
